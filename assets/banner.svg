<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Ledgera node-scripts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ececec"/>
      <stop offset="1" stop-color="#dedede"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6f6f6"/>
      <stop offset="1" stop-color="#f6f6f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232323"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <circle cx="900" cy="150" r="230" fill="url(#halo)"/>
  <path d="M640 330 A300 300 0 0 1 760 70" fill="none" stroke="#bdbdbd" stroke-width="1"/>
  <path d="M672 330 A270 270 0 0 1 782 96" fill="none" stroke="#cdcdcd" stroke-width="1"/>

  <!-- left: title -->
  <g font-family="'Helvetica Neue', Arial, sans-serif">
    <text x="64" y="104" fill="#3a3a3a" font-size="15" font-weight="600" letter-spacing="7">LEDGERA</text>
    <text x="60" y="170" fill="#111111" font-size="62" font-weight="900" letter-spacing="-1">node-scripts</text>
    <text x="64" y="208" fill="#2a2a2a" font-size="14" font-weight="500" letter-spacing="4.5">BARE SERVER → SYNCED NODE</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a">
    <rect x="64" y="240" width="140" height="28" rx="14" fill="none" stroke="#1a1a1a"/>
    <text x="80" y="259">celestia-mocha</text>
    <rect x="214" y="240" width="76" height="28" rx="14" fill="none" stroke="#8a8a8a"/>
    <text x="230" y="259">nibiru</text>
    <rect x="300" y="240" width="104" height="28" rx="14" fill="none" stroke="#8a8a8a"/>
    <text x="316" y="259">dymension</text>
    <rect x="414" y="240" width="60" height="28" rx="14" fill="none" stroke="#8a8a8a"/>
    <text x="430" y="259">lava</text>
  </g>

  <!-- right: terminal as a black unit, like the validator box -->
  <g transform="translate(600 52)">
    <rect x="6" y="10" width="540" height="232" rx="14" fill="#000000" opacity="0.12"/>
    <rect width="540" height="232" rx="14" fill="url(#box)" stroke="#000000"/>
    <rect x="1.5" y="1.5" width="537" height="229" rx="12.5" fill="none" stroke="#3a3a3a" stroke-opacity="0.6"/>
    <circle cx="22" cy="20" r="4.5" fill="#4a4a4a"/>
    <circle cx="38" cy="20" r="4.5" fill="#4a4a4a"/>
    <circle cx="54" cy="20" r="4.5" fill="#4a4a4a"/>
    <text x="518" y="25" text-anchor="end" fill="#7a7a7a" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="2">VALIDATOR</text>
    <line x1="0" y1="38" x2="540" y2="38" stroke="#2c2c2c"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
      <text x="22" y="70" fill="#f0f0f0"><tspan fill="#7a7a7a">$</tspan> bash install.sh celestia-mocha --moniker ledgera</text>
      <text x="22" y="98" fill="#f0f0f0"><tspan fill="#a8a8a8">==&gt;</tspan> Celestia Mocha · mocha-5</text>
      <text x="56" y="120" fill="#a0a0a0">network is running v10.4.0-mocha</text>
      <text x="56" y="142" fill="#a0a0a0">sha256 verified · BBR enabled</text>
      <text x="56" y="164" fill="#a0a0a0">state sync · ports 26xxx</text>
      <text x="22" y="192" fill="#f0f0f0"><tspan fill="#a8a8a8">==&gt;</tspan> done · service celestia-appd active</text>
      <rect x="22" y="204" width="9" height="16" fill="#e0e0e0" opacity="0.85"/>
    </g>
  </g>
</svg>
