<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Ledgera node-scripts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141416"/>
      <stop offset="1" stop-color="#0b0b0c"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>

  <!-- left: title -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="120" fill="#8a8a90" font-size="15" letter-spacing="6">LEDGERA</text>
    <text x="62" y="176" fill="#f2f2f2" font-size="46" font-weight="700">node-scripts</text>
    <text x="64" y="214" fill="#9a9aa0" font-size="16">one command from bare server to synced node</text>
    <g font-size="13" fill="#c9c9cc">
      <rect x="64" y="244" width="140" height="26" rx="4" fill="none" stroke="#3a3a3f"/>
      <text x="78" y="262">celestia-mocha</text>
      <rect x="214" y="244" width="76" height="26" rx="4" fill="none" stroke="#3a3a3f"/>
      <text x="228" y="262">nibiru</text>
      <rect x="300" y="244" width="104" height="26" rx="4" fill="none" stroke="#3a3a3f"/>
      <text x="314" y="262">dymension</text>
      <rect x="414" y="244" width="60" height="26" rx="4" fill="none" stroke="#3a3a3f"/>
      <text x="428" y="262">lava</text>
    </g>
  </g>

  <!-- right: terminal -->
  <g transform="translate(600 56)">
    <rect width="540" height="228" rx="10" fill="#0a0a0b" stroke="#2c2c30"/>
    <circle cx="20" cy="18" r="5" fill="#3a3a3f"/>
    <circle cx="38" cy="18" r="5" fill="#3a3a3f"/>
    <circle cx="56" cy="18" r="5" fill="#3a3a3f"/>
    <line x1="0" y1="36" x2="540" y2="36" stroke="#1f1f22"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
      <text x="22" y="66" fill="#f2f2f2"><tspan fill="#6f6f75">$</tspan> bash install.sh celestia-mocha --moniker ledgera</text>
      <text x="22" y="94" fill="#f2f2f2"><tspan fill="#7bd88f">==&gt;</tspan> Celestia Mocha · mocha-5</text>
      <text x="56" y="116" fill="#9a9aa0">network is running v10.4.0-mocha</text>
      <text x="56" y="138" fill="#9a9aa0">sha256 verified · BBR enabled</text>
      <text x="56" y="160" fill="#9a9aa0">state sync · ports 26xxx</text>
      <text x="22" y="188" fill="#f2f2f2"><tspan fill="#7bd88f">==&gt;</tspan> done · service celestia-appd active</text>
      <rect x="22" y="200" width="9" height="16" fill="#f2f2f2" opacity="0.8"/>
    </g>
  </g>
</svg>
